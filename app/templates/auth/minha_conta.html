{% extends "base.html" %}
{% block title %}Minha conta — CRM Comercial ÔA{% endblock %}

{% block conteudo %}
<div class="cabecalho-pagina">
  <div>
    <h2>Minha conta</h2>
    <p class="nota">Logado como <strong>{{ current_user.nome }}</strong> ({{ current_user.login }})</p>
  </div>
</div>

<div class="cartao">
  <h3>Alterar minha senha</h3>
  <form method="post" style="max-width: 400px;">
    <div class="campo">
      <label for="senha_atual">Senha atual</label>
      <input type="password" id="senha_atual" name="senha_atual" required>
    </div>
    <div class="campo">
      <label for="nova_senha">Nova senha</label>
      <input type="password" id="nova_senha" name="nova_senha" required
             placeholder="Mínimo 4 caracteres">
    </div>
    <div class="campo">
      <label for="confirmar_senha">Confirmar nova senha</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" required>
    </div>
    <div class="acoes-form">
      <button type="submit" class="botao botao-principal">Alterar senha</button>
      <a href="{{ url_for('main.index') }}" class="botao">Voltar</a>
    </div>
  </form>
</div>
{% endblock %}
